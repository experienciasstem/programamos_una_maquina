/* Tipografía institucional Archivo, servida localmente (SIL OFL 1.1, ver assets/fonts/OFL-Archivo.txt) */

:root{
  --amarillo:#FFCC00; --azul:#153244; --verde:#8DE2D6; --verde2:#79C7C3;
  --amarillo-suave:#fff5cc; --gris-titulo:#e9edf1; --gris-bajada:#f0f0f0;
  --texto:#1e293b; --texto2:#334155; --borde:#e2e8f0;
  --ok:#1f7a5c; --ok-bg:#e3f6ef; --alerta-bg:#fff5cc; --no-bg:#fde8e8; --no:#9b2c2c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Archivo",Arial,Helvetica,sans-serif;background:#f8fafc;color:var(--texto);font-size:24px;line-height:1.65}
img{max-width:100%}
[tabindex="-1"]:focus{outline:none;box-shadow:none}
:focus-visible{outline:4px solid var(--amarillo);outline-offset:3px;box-shadow:0 0 0 7px var(--azul);border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;background:var(--azul);color:#fff;padding:10px 16px;border-radius:10px;z-index:2000;font-weight:700}
.skip:focus{left:8px}
.container{max-width:1100px;margin:0 auto;padding:28px 24px 80px}

/* Menú superior (export-top-nav de las secuencias de referencia) */
.export-top-nav{position:relative;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--borde)}
.export-nav-item{position:relative}
.export-nav-cover,.export-nav-section-button{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;border:1px solid var(--borde);background:#fff;color:var(--texto2);border-radius:999px;padding:8px 18px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s ease}
.export-nav-cover:hover,.export-nav-section-button:hover{border-color:var(--azul);color:var(--azul)}
.export-nav-cover.is-active,.export-nav-section-button.is-active{background:var(--amarillo);color:var(--azul);border-color:var(--amarillo)}
.export-nav-menu{position:absolute;left:0;top:100%;z-index:80;width:min(320px,calc(100vw - 28px));padding-top:8px;visibility:hidden;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s ease,transform .15s ease,visibility .15s ease}
.export-nav-item:hover .export-nav-menu,.export-nav-item:focus-within .export-nav-menu{visibility:visible;opacity:1;transform:translateY(0);pointer-events:auto}
.export-nav-item.is-closed .export-nav-menu{visibility:hidden;opacity:0;pointer-events:none}
.export-nav-menu::before{content:"";position:absolute;left:0;right:0;top:8px;bottom:0;z-index:-1;border:1px solid var(--borde);border-radius:12px;background:#fff;box-shadow:0 18px 44px rgba(15,23,42,.14)}
.export-nav-lesson{display:block;width:100%;text-align:left;text-decoration:none;background:#fff;color:var(--texto2);padding:12px 16px;font:inherit;font-size:16px;line-height:1.35;transition:all .2s ease}
.export-nav-lesson:first-child{border-top-left-radius:12px;border-top-right-radius:12px}
.export-nav-lesson:last-child{border-bottom-left-radius:12px;border-bottom-right-radius:12px}
.export-nav-lesson:hover{background:#f8fafc;color:var(--azul)}
.export-nav-lesson.is-active{background:var(--amarillo);color:var(--azul);font-weight:700}
.export-nav-lesson .soon{display:block;font-size:16px;font-style:italic;color:#64748b;margin-top:2px}
.export-nav-lesson.is-active .soon{color:var(--azul)}
/* Frase de cierre (componente_11 · Juguetes) */
.closing-phrase{background:#fff;color:var(--azul);font-size:clamp(26px,3.2vw,36px);line-height:1.4;text-align:center;padding:20px clamp(12px,4vw,48px);border-radius:12px}

/* Bloque base de las secuencias de referencia */
.block{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:20px;margin-bottom:16px;position:relative}
.block.plain{background:transparent;border:0;padding:0}
.section-title{margin:0 0 8px;font-size:1.35rem;color:var(--texto2);font-weight:700}

/* 1. Encabezado de desafío fotográfico (componente_01 · Dinero papel) */
.challenge-header{margin:0 0 16px}
.challenge-header .frame{position:relative;overflow:hidden;border-radius:12px;background:#1d4257}
.challenge-header img{display:block;width:100%;height:clamp(240px,38vw,420px);object-fit:cover}
.challenge-header .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,rgba(15,23,42,.18),rgba(15,23,42,.52))}
.challenge-header .overlay p{margin:0;color:#fff;font-size:clamp(30px,5.2vw,60px);line-height:1.15;font-weight:700;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.45);max-width:16ch}
.challenge-header figcaption{font-size:16px;color:#64748b;margin-top:8px}
.provisional{display:inline-block;background:var(--azul);color:var(--amarillo);font-weight:800;font-size:16px;letter-spacing:.04em;border-radius:999px;padding:2px 12px;margin-right:8px}

/* Fila de título con ícono */
.heading-row{display:flex;align-items:center;gap:16px}
.heading-row h1,.heading-row h2,.heading-row h3{flex:1;min-width:0;margin:0;overflow-wrap:anywhere}
.heading-row h1{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.2;color:var(--azul)}
.icon-56{width:56px;height:56px;flex-shrink:0;object-fit:contain;border-radius:12px;display:block}
.icon-48{width:48px;height:48px;flex-shrink:0;object-fit:contain;border-radius:10px;display:block}
.icon-ph{display:inline-block;flex-shrink:0;border:3px dashed currentColor;border-radius:12px;opacity:.55}
.icon-ph.s56{width:56px;height:56px}.icon-ph.s48{width:48px;height:48px}

/* 2. Pregunta disparadora + bajada (componente_03 · Dinero papel) */
.question-band{background:var(--azul);color:#fff;text-align:center;font-size:clamp(28px,4.4vw,50px);line-height:1.3;padding:clamp(22px,4vw,44px) clamp(18px,5vw,64px);border-radius:12px;margin:0 0 16px}
.bajada{background:var(--gris-bajada);color:#000;text-align:center;font-size:clamp(20px,2.4vw,25px);line-height:1.6;padding:22px clamp(16px,4vw,48px);border-radius:12px;margin:0 0 28px}

/* 3. Título de actividad (modelo_titulo_actividad · Hoja de ruta) */
.activity-title{display:flex;align-items:center;gap:16px;background:var(--verde);color:var(--azul);padding:1rem;border-radius:1rem;margin:40px 0 16px;scroll-margin-top:16px}
.activity-title h2{flex:1;min-width:0;margin:0;font-size:clamp(26px,3.4vw,40px);font-weight:700;line-height:1.2}

/* Título gris (Para saber más) */
.grey-title{background:var(--gris-titulo);padding:1rem;border-radius:1rem;margin:0 0 12px}
.grey-title h3{margin:0;font-size:24px;font-weight:700;color:var(--texto)}

/* Texto común */
.text{font-size:clamp(20px,2.3vw,24px);line-height:1.7;color:var(--texto)}
.text p{margin:0 0 .9em}.text p:last-child{margin-bottom:0}
.text ul{margin:.4em 0 0;padding-left:1.3em}.text li{margin:.25em 0}



/* Proceso paso a paso (modelo_proceso_pasos) */
.wizard{background:#fff;border:1px solid #e2e8ef;border-radius:35px;box-shadow:0 6px 10px #18243822;overflow:hidden;margin:0 0 16px}
.wizard .steps{background:#f8fafc;border-bottom:1px solid #eef2f5;padding:20px 24px;display:flex;align-items:center;gap:12px}
.wizard .step{height:46px;width:46px;border-radius:50%;border:0;background:#c5e9e5;color:#43606e;font-weight:700;cursor:pointer;font-size:18px;font-family:inherit}
.wizard .step.active{background:var(--verde);box-shadow:0 4px 10px #18344525;color:var(--azul)}
.wizard .step-line{height:2px;width:30px;background:#dce7ed}
.wizard .wizard-copy{padding:30px 40px 20px;min-height:210px}
.wizard .eyebrow{color:#5145ff;font-size:16px;letter-spacing:1.2px;font-weight:800}
.wizard h3{font-size:clamp(24px,2.8vw,30px);font-weight:800;margin:14px 0 16px;color:#192538}
.wizard .wizard-copy p,.wizard .wizard-copy li{font-size:clamp(20px,2.3vw,24px);line-height:1.75;color:#45566b}
.wizard .wizard-copy ul{margin:.3em 0 0;padding-left:1.2em}
.wizard .wizard-actions{display:flex;justify-content:space-between;padding:12px 40px 28px}
.wizard .wizard-actions button{background:transparent;border:0;color:#5145ff;font-weight:750;cursor:pointer;padding:10px 0;font-family:inherit;font-size:19px}
.wizard .wizard-actions button:disabled{opacity:.35;cursor:default}

/* Imagen + texto (componente_08 · Biodiversidad) */
.media-text{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:center;border:1px solid var(--borde);border-radius:18px;padding:20px;background:#fff;margin:0 0 16px}
.media-text.right .mt-media{order:2}
.mt-media{overflow:hidden;border-radius:16px;background:#eefaf8}
.mt-media img{display:block;width:100%;height:100%;min-height:220px;object-fit:contain}
.mt-body h3{margin:0 0 10px;color:var(--azul);font-size:1.15em}

/* Botones (componentes 32/33) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700;border:2px solid var(--azul);font-family:inherit;font-size:19px;cursor:pointer;line-height:1.25;transition:background .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--azul);color:#fff}
.btn-primary:hover{background:#0e2533}
.btn-secondary{background:#fff;color:var(--azul)}
.btn-secondary:hover{background:#edf3f6}
.btn-outline{background:#edf3f6;color:var(--azul)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn svg{width:20px;height:20px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* Aviso de pausa de pantalla */
.screen-pause{display:flex;gap:14px;align-items:center;background:var(--azul);color:#fff;border-radius:14px;padding:14px 18px;margin-top:14px;font-weight:700}
.screen-pause svg{flex-shrink:0;width:40px;height:40px}

/* ===== Simulador «El robot mensajero» (COMPONENTE ORIGINAL NUEVO) ===== */
.sim{background:#fff;border:3px solid var(--azul);border-radius:22px;overflow:hidden;margin:0 0 16px;scroll-margin-top:12px}
.sim-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--azul);color:#fff;padding:12px 20px}
.sim-head h3{margin:0;font-size:26px;color:var(--amarillo)}
.sim-head .tag{font-size:16px;font-weight:700;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px}
.sim-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;padding:20px}
.board-wrap{position:relative}
.board{display:block;width:100%;height:auto;background:#f4fbfa;border-radius:14px;border:3px solid var(--azul)}
.board .cell{fill:#f4fbfa;stroke:var(--verde2);stroke-width:2}
.board .obst{fill:var(--azul)}
#robot{transition:transform .38s ease-in-out}
#robot.bump{animation:bump .35s}
@keyframes bump{30%{filter:drop-shadow(0 0 0 #c0392b)}50%{filter:drop-shadow(0 0 6px #c0392b)}}
.board-status{margin-top:10px;font-size:19px;color:var(--texto2);background:#f1f5f9;border-radius:10px;padding:8px 12px}
.board-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:17px;color:#475569;margin-top:8px}
.board-legend span{display:inline-flex;align-items:center;gap:6px}
.arrival{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(21,50,68,.78);border-radius:14px;color:#fff;text-align:center;padding:20px}
.arrival.show{display:flex}
.arrival strong{display:block;font-size:34px;color:var(--amarillo);margin-bottom:6px}
.arrival p{margin:0 0 12px;font-size:22px}

.input-area label{display:block;font-weight:800;color:var(--azul);font-size:21px;margin-bottom:6px}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;min-width:0;font:inherit;font-size:22px;padding:12px 14px;border:2px solid var(--azul);border-radius:12px;background:#fff}
.mic-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mic-btn{width:56px;height:56px;border-radius:50%;border:3px dashed #94a3b8;background:#f1f5f9;display:grid;place-items:center;cursor:not-allowed;color:#64748b}
.mic-btn svg{width:26px;height:26px}
.mic-note{font-size:17px;color:#475569;line-height:1.45;flex:1;min-width:180px}
.mic-note strong{color:var(--azul)}

.pipeline{display:grid;gap:10px;margin-top:16px}
.stage{border-radius:14px;border:2px solid #dbe4ea;padding:10px 14px;background:#fff}
.stage .lbl{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#475569}
.stage .num{width:28px;height:28px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:16px}
.stage .val{font-size:20px;line-height:1.5;margin-top:4px;min-height:1.5em;color:var(--texto)}
.stage .val .q{font-weight:800;color:var(--azul)}
.stage .val mark{background:var(--amarillo);color:var(--azul);border-radius:4px;padding:0 4px;font-weight:700}
.stage.empty .val{color:#94a3b8;font-style:italic}
.stage.t-reconocida{border-color:var(--verde2);background:#effaf8}
.stage.t-incompleta,.stage.t-varias{border-color:#e9b800;background:var(--alerta-bg)}
.stage.t-no_prevista,.stage.t-vacia{border-color:#e3a3a3;background:var(--no-bg)}
.badge{display:inline-block;font-size:16px;font-weight:800;border-radius:999px;padding:2px 10px;vertical-align:middle;white-space:nowrap}
.badge.t-reconocida{background:var(--verde);color:var(--azul)}
.badge.t-incompleta,.badge.t-varias{background:var(--amarillo);color:var(--azul)}
.badge.t-no_prevista,.badge.t-vacia{background:#f3c2c2;color:#7a1f1f}
.sim-controls{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 18px}
.history{margin:0 20px 20px;border-top:2px dashed #dbe4ea;padding-top:14px}
.history h4{margin:0 0 4px;font-size:22px;color:var(--azul)}
.history .note{font-size:17px;color:#475569;margin:0 0 10px}
.table-wrap{overflow-x:auto}
table.hist{border-collapse:collapse;width:100%;min-width:680px;font-size:17px}
table.hist th{background:var(--verde);color:var(--azul);text-align:left;padding:8px 10px;border:1px solid #d9e4e8}
table.hist td{padding:8px 10px;border:1px solid #d9e4e8;vertical-align:top;line-height:1.45}
table.hist tr.sep td{background:#f1f5f9;font-weight:700;color:#475569;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
table.hist .empty-row td{color:#94a3b8;font-style:italic;text-align:center}

/* Pestañas de contenido (componente_18/19) */
.tabs-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:20px;font-weight:700;color:var(--azul);opacity:.72;transition:all .2s}
.tab-btn:hover{opacity:1}
.tab-btn[aria-selected="true"]{border-color:var(--verde2);background:#eefaf8;box-shadow:inset 0 0 0 1px rgba(121,199,195,.16);opacity:1}
.tab-panel{border:1px solid var(--borde);border-radius:14px;padding:18px}
.tab-panel[hidden]{display:none}
.tab-body{display:flex;flex-direction:column;gap:18px}
@media(min-width:768px){.tab-body{flex-direction:row;align-items:center}.tab-body .tab-img{width:46%;flex-shrink:0}}
.tab-img img{display:block;width:100%;border-radius:16px}
.tab-text{font-size:24px;line-height:1.65}
.tab-text .big{font-size:1.05em;font-weight:700;color:var(--azul)}

/* Para saber más (componente_13 ajustado: fondo amarillo suave en TODO el cuerpo) */
.callout-saber{background:var(--amarillo-suave);border-radius:14px;padding:22px 26px;font-size:clamp(18px,2vw,22px);line-height:1.7;color:var(--texto)}
.callout-saber p{margin:0 0 14px}.callout-saber p:last-child{margin:0}

/* Galería ampliable (componente_31 · Eclipses) */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.gallery figure{margin:0}
.gallery button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:12px}
.gallery img{display:block;width:100%;border-radius:12px}
.gallery figcaption{color:#475569;font-size:19px;margin-top:6px;font-weight:700;text-align:center}
.lightbox{position:fixed;inset:0;background:rgba(2,6,23,.88);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000}
.lightbox[hidden]{display:none}
.lightbox figure{margin:0;text-align:center;max-width:min(900px,100%)}
.lightbox img{max-width:100%;max-height:78vh;border-radius:18px;background:#fff;display:block;margin:0 auto}
.lightbox figcaption{margin-top:10px;color:#fff;font-size:22px;font-weight:700}
.lightbox .close{position:absolute;top:16px;right:16px;width:52px;height:52px;border-radius:50%;border:2px solid #fff;background:var(--azul);color:#fff;font-size:28px;cursor:pointer;line-height:1}

/* Preguntas para conversar */
.talk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;margin:6px 0 4px;padding:0;list-style:none;counter-reset:q}
.talk li{counter-increment:q;position:relative;background:#eefaf8;border:2px solid var(--verde2);border-radius:20px 20px 20px 4px;padding:18px 18px 18px 66px;font-size:clamp(20px,2.2vw,22px);line-height:1.5;color:var(--azul);font-weight:600}
.talk li::before{content:counter(q);position:absolute;left:14px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--amarillo);border:2px solid var(--azul);display:grid;place-items:center;font-weight:800}

/* Ticket de salida (componente_12 · azul #153244) */
.ticket{background:#153244;color:#fff;border-radius:12px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;font-size:20px;font-weight:700;line-height:1.6;margin:40px 0 16px}
.ticket .t-head{display:block;letter-spacing:.02em}
.ticket .t-body{font-weight:700}

/* Separador (componente_10) */
.sep-line{border:0;border-top:4px solid #cbd5e1;margin:28px auto;width:100%}


.export-nav-item:nth-last-child(-n+2) .export-nav-menu{left:auto;right:0}
@media(max-width:720px){
  .export-nav-item{position:static}
  .export-nav-item:nth-last-child(-n+2) .export-nav-menu{left:0;right:auto}
  .export-nav-menu{left:0;width:100%}
}
@media(max-width:860px){
  .sim-grid{grid-template-columns:1fr}
  .media-text{grid-template-columns:1fr}
  .media-text.right .mt-media{order:0}
}
@media(max-width:600px){
  body{font-size:20px}
  .container{padding:16px 12px 60px}
  .wizard .wizard-copy{padding:22px}
  .wizard .wizard-actions{padding:10px 22px 22px}
  .icon-56,.icon-ph.s56{width:42px;height:42px}
}
@media (prefers-reduced-motion: reduce){#robot{transition:none}html{scroll-behavior:auto}}

/* ===== Encabezado de secuencia · portada (modelo_portada_secuencia, referencia aprobada) ===== */
.seq-header{border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(21,50,68,.12);margin:0 0 8px;background:#fff}
.seq-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:#F3CB45;padding:14px 26px}
.seq-bar .brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:18px;color:var(--azul)}
.seq-bar .brand b{letter-spacing:.18em;font-size:18px;font-weight:700}
.seq-bar .brand span{font-size:18px;font-weight:600}
.seq-areas{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.seq-areas li{background:#f8e7a6;color:var(--azul);border-radius:999px;padding:4px 16px;font-size:16px;font-weight:700}
.seq-photo{position:relative;background:#1d4257}
.seq-photo img{display:block;width:100%;height:clamp(260px,40vw,500px);object-fit:cover}
.seq-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.05) 30%,rgba(15,23,42,.55))}
.seq-title{position:absolute;right:clamp(16px,3vw,36px);bottom:clamp(20px,4vw,52px);z-index:1;text-align:right;max-width:min(760px,90%)}
.seq-title h1{margin:0;color:#fff;font-size:clamp(32px,5vw,60px);line-height:1.12;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.seq-title i{display:inline-block;width:180px;height:12px;border-radius:9px;background:var(--verde);margin-top:18px}
.seq-curve{position:absolute;left:0;bottom:0;z-index:1;width:clamp(120px,18vw,240px);height:clamp(100px,15vw,200px);background:#fff;border-top-right-radius:100% 100%}
.seq-foot{height:20px;background:var(--azul)}
.grade-tag{display:inline-flex;align-items:center;margin:16px 0 0;padding:6px 16px;border-radius:999px;background:#eefaf8;border:2px solid var(--verde2);color:var(--azul);font-weight:700;font-size:18px}
.intro-actions{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding-top:16px;margin-top:24px;border-top:1px solid var(--borde)}

/* Pestañas de objetivos (componente_17 · Juguetes) */
.obj-panel .tab-text{font-size:clamp(20px,2.3vw,24px)}

/* Botones chicos */
.btn-sm{padding:9px 14px;font-size:17px}

/* Recurso pendiente (patrón block-h5p-unavailable de las referencias) */
.pending-resource{border:2px dashed #94a3b8;border-radius:14px;background:#f8fafc;color:#475569;padding:26px;text-align:center;margin:14px 0}
.pending-resource strong{display:block;color:var(--azul);font-size:22px;margin-bottom:6px}
.pending-resource p{margin:0;font-size:18px;line-height:1.5}

/* Acordeón · consigna (componente_22 / Dinero papel) */
.accordion details{border:1px solid var(--borde);border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden}
.accordion summary{cursor:pointer;background:var(--azul);color:#fff;font-size:20px;padding:12px 16px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.accordion summary::-webkit-details-marker{display:none}
.accordion summary::after{content:"+";font-size:26px;font-weight:700;line-height:1}
.accordion details[open] summary::after{content:"–"}
.accordion .acc-body{padding:18px 22px;line-height:1.7;font-size:clamp(20px,2.2vw,22px)}
.accordion .acc-body p{margin:0 0 1em}.accordion .acc-body ul{margin:0 0 1em;padding-left:1.2em}

/* ===== Creador de misiones ===== */
.mc{background:#fff;border:3px solid var(--azul);border-radius:22px;overflow:hidden;margin:0 0 16px;scroll-margin-top:12px}
.mc-inner{padding:20px}
.storage-note{background:var(--alerta-bg);border:2px solid #e9b800;border-radius:12px;padding:10px 14px;font-size:17px;margin:0 0 14px}
.sym-img{display:block;width:64px;height:64px;object-fit:contain}
.sym-fallback{display:flex;align-items:center;justify-content:center;width:64px;height:64px;font-size:16px;font-weight:700;line-height:1.1;text-align:center;color:var(--azul);background:#f1f5f9;border-radius:8px;padding:2px}
.mc-board{display:block;width:100%;height:auto;background:#f4fbfa;border-radius:14px;border:3px solid var(--azul)}
.mc-board .cell{fill:#f4fbfa;stroke:var(--verde2);stroke-width:2}
.mc-board .obst{fill:var(--azul)}.mc-board.num{background:transparent;border:0;border-radius:0}.mc-board .coord{font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:30px;fill:#153244}

<section class="mc" id="mi-codigo" aria-labelledby="mi-codigo-t">
    <div class="sim-head"><h3 id="mi-codigo-t">Creador de misiones · Mi código</h3><span class="mc-io"><button type="button" class="btn-io" data-t="descargar">Descargar código</button><button type="button" class="btn-io" data-t="cargar">Cargar código</button><input type="file" accept="image/png" hidden data-t="archivo" aria-label="Elegir la imagen del código"></span></div>
    <div class="mc-inner mcx">
      <p class="storage-note" data-storage-note hidden>Este navegador no permite guardar datos: el código y las misiones se conservan solo mientras la página esté abierta.</p>
      <div class="mcx-draw">
        <p class="mcx-lab"><strong>Espacios</strong></p>
        <p class="mcx-lab code-label">Espacio: <strong class="code-current">ninguno</strong></p>
        <div class="mcx-col"><div class="code-thumbs" role="tablist" aria-label="Espacios del código"></div><label class="mc-team"><span>Nombre del equipo</span><input type="text" maxlength="40" data-t="equipo" autocomplete="off" placeholder="Ej.: Los Robots"></label></div>
        <div class="mcx-col code-draw"><canvas class="code-canvas" width="240" height="240" role="img" aria-label="Espacio para dibujar el símbolo"></canvas><div class="pen-tools" role="group" aria-label="Color y grosor del lápiz"><button type="button" class="pen-col" data-col="#153244" style="background:#153244" aria-label="Color azul oscuro" title="Color azul oscuro" aria-pressed="true"></button><button type="button" class="pen-col" data-col="#D62828" style="background:#D62828" aria-label="Color rojo" title="Color rojo" aria-pressed="false"></button><button type="button" class="pen-col" data-col="#2A9D8F" style="background:#2A9D8F" aria-label="Color verde" title="Color verde" aria-pressed="false"></button><button type="button" class="pen-col" data-col="#F77F00" style="background:#F77F00" aria-label="Color naranja" title="Color naranja" aria-pressed="false"></button><button type="button" class="pen-col" data-col="#6A4C93" style="background:#6A4C93" aria-label="Color violeta" title="Color violeta" aria-pressed="false"></button><span class="pen-sep" aria-hidden="true"></span><button type="button" class="pen-w" data-w="5" aria-label="Lápiz fino" title="Lápiz fino" aria-pressed="false"><i style="width:5px;height:5px"></i></button><button type="button" class="pen-w" data-w="10" aria-label="Lápiz medio" title="Lápiz medio" aria-pressed="true"><i style="width:10px;height:10px"></i></button><button type="button" class="pen-w" data-w="18" aria-label="Lápiz grueso" title="Lápiz grueso" aria-pressed="false"><i style="width:16px;height:16px"></i></button></div><button type="button" class="btn btn-outline btn-sm" data-t="borrar">Borrar dibujo</button><button type="button" class="btn btn-primary btn-sm" data-t="guardar">Guardar código</button><span class="code-save-st" aria-live="polite"></span></div>
      </div>
      <div class="mcx-test code-test">
        <div class="code-test-btns"><button type="button" class="btn btn-primary btn-sm" data-t="probar">Probar este espacio</button><button type="button" class="btn btn-secondary btn-sm" data-mini-reset>Volver el robot a su lugar</button></div>
        <div class="code-board"></div>
        <div class="code-out" aria-live="polite">Elijan un espacio y toquen «Probar este espacio».</div>
      </div>
    </div>
  </section>
</main>
<script>
  /* =====================================================================
     CREADOR DE MISIONES · núcleo compartido (D2 a D5 y archivos independientes)
     El sistema no reconoce el significado de los dibujos: cada espacio está
     asociado a una acción y se ejecuta lo previsto en su programación.
     ===================================================================== */
  var MC=(function(){
    var KEY='stemplus-maquina-v1';
    var ACC=['AVANZAR','GIRAR_DERECHA','GIRAR_IZQUIERDA','DETENER'];
    var ACC_TXT={AVANZAR:'Avanzar',GIRAR_DERECHA:'Girar a la derecha',GIRAR_IZQUIERDA:'Girar a la izquierda',DETENER:'Detenerse'};
    var DIR_TXT=['arriba','la derecha','abajo','la izquierda'],DX=[0,1,0,-1],DY=[-1,0,1,0];
    var persist=true,store;
    function blank(){return {version:'1.0',codigo:{AVANZAR:null,GIRAR_DERECHA:null,GIRAR_IZQUIERDA:null,DETENER:null},misiones:[]};}
    try{store=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){persist=false;store=null;}
    if(!store||store.version!=='1.0'||!store.codigo){store=blank();}
    if(!Array.isArray(store.misiones))store.misiones=[];
    var listeners=[];
    function onChange(f){listeners.push(f);}
    function save(){
      try{localStorage.setItem(KEY,JSON.stringify(store));persist=true;}catch(e){persist=false;}
      notes();listeners.forEach(function(f){f();});
    }
    function notes(){document.querySelectorAll('[data-storage-note]').forEach(function(n){n.hidden=persist;});}
    // Otra pestaña o archivo independiente modificó los datos: recargar
    window.addEventListener('storage',function(e){if(e.key!==KEY)return;try{var s=JSON.parse(e.newValue||'null');if(s&&s.codigo){store.codigo=s.codigo;store.misiones=s.misiones||[];listeners.forEach(function(f){f();});}}catch(x){}});
    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    var NS='http://www.w3.org/2000/svg';
    function el(n,a,parent){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(parent)parent.appendChild(e);return e;}
    function symbolHTML(acc,cls){
      var d=store.codigo[acc];
      if(d)return '<img class="'+(cls||'sym-img')+'" src="'+d+'" alt="">';
      return '<span class="sym-fallback glyph" title="'+ACC_TXT[acc]+' (sin símbolo)">?</span>';
    }
    var CHARS={
      robot:{nombre:'Robot mensajero',svg:'<rect x="-44" y="-26" width="14" height="44" rx="5" fill="#153244"/><rect x="30" y="-26" width="14" height="44" rx="5" fill="#153244"/><rect x="-34" y="-36" width="68" height="70" rx="16" fill="#FFCC00" stroke="#153244" stroke-width="4"/><rect x="-22" y="-30" width="44" height="12" rx="6" fill="#153244"/><circle cx="-10" cy="-24" r="3.5" fill="#8DE2D6"/><circle cx="10" cy="-24" r="3.5" fill="#8DE2D6"/><path d="M0 -58 L13 -42 L-13 -42 Z" fill="#153244"/><rect x="-20" y="-8" width="40" height="28" rx="3" fill="#fff" stroke="#153244" stroke-width="3"/><path d="M-19 -6 L0 8 L19 -6" fill="none" stroke="#153244" stroke-width="3"/>'},
      auto:{nombre:'Autito',svg:'<rect x="-40" y="-30" width="14" height="22" rx="5" fill="#153244"/><rect x="26" y="-30" width="14" height="22" rx="5" fill="#153244"/><rect x="-40" y="14" width="14" height="22" rx="5" fill="#153244"/><rect x="26" y="14" width="14" height="22" rx="5" fill="#153244"/><path d="M-28 -34 Q0 -50 28 -34 L30 38 Q0 44 -30 38 Z" fill="#8DE2D6" stroke="#153244" stroke-width="4"/><rect x="-18" y="-24" width="36" height="16" rx="5" fill="#fff" stroke="#153244" stroke-width="3"/><rect x="-18" y="8" width="36" height="18" rx="5" fill="#79C7C3" stroke="#153244" stroke-width="3"/><path d="M0 -60 L12 -46 L-12 -46 Z" fill="#153244"/>'},
      dron:{nombre:'Dron',svg:'<g stroke="#153244" stroke-width="7" stroke-linecap="round"><line x1="-26" y1="-26" x2="26" y2="26"/><line x1="26" y1="-26" x2="-26" y2="26"/></g><g fill="#fff" stroke="#153244" stroke-width="4"><circle cx="-30" cy="-30" r="14"/><circle cx="30" cy="-30" r="14"/><circle cx="-30" cy="30" r="14"/><circle cx="30" cy="30" r="14"/></g><circle r="20" fill="#FFCC00" stroke="#153244" stroke-width="4"/><circle cy="-8" r="5" fill="#153244"/><path d="M0 -60 L12 -46 L-12 -46 Z" fill="#153244"/>'}
    };
    var GOALS={
      buzon:{nombre:'Buzón',svg:'<rect x="-5" y="2" width="10" height="34" fill="#153244"/><path d="M-30 -8 Q-30 -34 0 -34 Q30 -34 30 -8 L30 6 L-30 6 Z" fill="#FFCC00" stroke="#153244" stroke-width="4"/><rect x="-18" y="-14" width="36" height="7" rx="3" fill="#153244"/>'},
      bandera:{nombre:'Bandera',svg:'<rect x="-16" y="-36" width="6" height="72" rx="3" fill="#153244"/><path d="M-10 -34 L30 -22 L-10 -8 Z" fill="#FFCC00" stroke="#153244" stroke-width="4" stroke-linejoin="round"/><ellipse cx="-13" cy="36" rx="20" ry="5" fill="#79C7C3"/>'},
      estrella:{nombre:'Estrella',svg:'<path d="M0 -36 L10 -12 L36 -11 L16 6 L23 32 L0 17 L-23 32 L-16 6 L-36 -11 L-10 -12 Z" fill="#FFCC00" stroke="#153244" stroke-width="4" stroke-linejoin="round"/>'}
    };
    var LABS={
      L1:{nombre:'Pasillos',cols:6,rows:5,start:{x:0,y:4,d:0},goal:{x:5,y:0},obst:[[1,1],[1,2],[1,3],[3,1],[3,2],[3,3],[3,4]]},
      L2:{nombre:'La plaza',cols:6,rows:5,start:{x:0,y:2,d:1},goal:{x:5,y:2},obst:[[2,1],[2,2],[2,3],[3,2]]},
      L3:{nombre:'Escalones',cols:6,rows:5,start:{x:0,y:4,d:1},goal:{x:5,y:0},obst:[[2,4],[3,3],[4,2],[1,1],[0,0]]},
      L4:{nombre:'El rincón',cols:6,rows:5,start:{x:5,y:4,d:3},goal:{x:0,y:0},obst:[[1,1],[2,1],[3,1],[1,3],[2,3],[4,3],[4,2]]}
    };

    /* ---------- Tablero ---------- */
    function Board(host,level,charKey,goalKey,maxH){
      var C=100,W=level.cols*C,H=level.rows*C;
      this.level=level;var num=!(host.closest&&host.closest('#mi-codigo')),M=num?46:0;
      var svg=el('svg',{viewBox:(-M)+' '+(-M)+' '+(W+M)+' '+(H+M),'class':'mc-board'+(num?' num':''),role:'img'});
      svg.style.maxWidth=((maxH||320)*(W+M)/(H+M))+'px';
      var t=el('title',{},svg);t.textContent='Tablero de '+level.cols+' columnas y '+level.rows+' filas';
      for(var y=0;y<level.rows;y++)for(var x=0;x<level.cols;x++)el('rect',{x:x*C,y:y*C,width:C,height:C,'class':'cell'},svg);
      if(num){el('rect',{x:0,y:0,width:W,height:H,rx:12,fill:'none',stroke:'#153244','stroke-width':6},svg);for(var cx=0;cx<level.cols;cx++){var tc=el('text',{x:cx*C+50,y:-13,'text-anchor':'middle','class':'coord'},svg);tc.textContent=cx+1;}for(var ry=0;ry<level.rows;ry++){var tr=el('text',{x:-23,y:ry*C+61,'text-anchor':'middle','class':'coord'},svg);tr.textContent=ry+1;}}
      level.obst.forEach(function(o){el('rect',{x:o[0]*C+14,y:o[1]*C+14,width:C-28,height:C-28,rx:10,'class':'obst'},svg);
        el('path',{d:'M'+(o[0]*C+30)+' '+(o[1]*C+30)+'l40 40M'+(o[0]*C+70)+' '+(o[1]*C+30)+'l-40 40',stroke:'#8DE2D6','stroke-width':6,'stroke-linecap':'round',opacity:.45},svg);});
      if(goalKey){var gx=level.goal.x*C,gy=level.goal.y*C;
        el('rect',{x:gx+6,y:gy+6,width:C-12,height:C-12,rx:14,fill:'#8DE2D6',stroke:'#153244','stroke-width':4},svg);
        var goal=el('g',{transform:'translate('+(gx+50)+' '+(gy+50)+') scale(.85)'},svg);goal.innerHTML=GOALS[goalKey].svg;}
      this.trace=el('polyline',{fill:'none',stroke:'#FFCC00','stroke-width':10,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.9,points:''},svg);
      this.who=el('g',{'class':'mc-char'},svg);this.rot=el('g',{},this.who);this.rot.innerHTML=CHARS[charKey||'robot'].svg;
      host.innerHTML='';host.appendChild(svg);
      this.reset();
    }
    Board.prototype.reset=function(){var s=this.level.start;this.x=s.x;this.y=s.y;this.d=s.d;this.deg=s.d*90;this.pts=[[this.x,this.y]];this.draw();};
    Board.prototype.draw=function(){
      this.who.style.transform='translate('+(this.x*100+50)+'px,'+(this.y*100+50)+'px)';
      this.who.setAttribute('transform','translate('+(this.x*100+50)+' '+(this.y*100+50)+')');
      this.rot.setAttribute('transform','rotate('+this.deg+') scale(.82)');
      this.trace.setAttribute('points',this.pts.map(function(p){return (p[0]*100+50)+','+(p[1]*100+50);}).join(' '));
    };
    Board.prototype.blocked=function(nx,ny){
      if(nx<0||ny<0||nx>=this.level.cols||ny>=this.level.rows)return 'la casilla siguiente está fuera del tablero (borde)';
      for(var i=0;i<this.level.obst.length;i++)if(this.level.obst[i][0]===nx&&this.level.obst[i][1]===ny)return 'hay un obstáculo en la casilla siguiente';
      return null;
    };
    Board.prototype.atGoal=function(){return this.x===this.level.goal.x&&this.y===this.level.goal.y;};
    Board.prototype.where=function(){return 'columna '+(this.x+1)+', fila '+(this.y+1)+', mirando hacia '+DIR_TXT[(this.d%4+4)%4];};
    Board.prototype.run=function(seq,onStep,done,keep){
      var self=this,i=0,k=0,passed=false,speed=matchMedia('(prefers-reduced-motion: reduce)').matches?60:430;
      if(!keep)self.reset();
      function finish(res){onStep(-1);done(res);}
      function next(){
        if(i>=seq.length){finish({ok:self.atGoal(),passed:passed&&!self.atGoal()});return;}
        var ins=seq[i];onStep(i);
        if(ins.a==='DETENER'){finish({ok:self.atGoal(),stopped:i,passed:passed&&!self.atGoal()});return;}
        if(ins.a==='AVANZAR'){
          var nx=self.x+DX[self.d],ny=self.y+DY[self.d],why=self.blocked(nx,ny);
          if(why){self.who.classList.remove('bump');void self.who.getBBox();self.who.classList.add('bump');finish({ok:false,error:why,at:i});return;}
          self.x=nx;self.y=ny;self.pts.push([nx,ny]);if(self.atGoal())passed=true;
        } else {var s=ins.a==='GIRAR_DERECHA'?1:-1;self.d=(self.d+s+4)%4;self.deg+=s*90;}
        self.draw();k++;
        if(k>=(ins.n||1)){k=0;i++;}
        setTimeout(next,speed);
      }
      next();
    };

    /* ---------- Editor de secuencias ---------- */
    function Editor(host,opts){
      var self=this;this.seq=[];this.repeat=!!opts.repeat;this.opts=opts;this.host=host;
      host.innerHTML='<div class="mc-palette" role="group" aria-label="Símbolos del código para agregar a la secuencia"></div>'+
        '<p class="mc-seq-label">Secuencia (de la primera a la última acción)</p><ol class="mc-seq" aria-label="Secuencia de instrucciones"></ol>';
      this.pal=host.querySelector('.mc-palette');this.list=host.querySelector('.mc-seq');
      this.renderPalette();this.render();onChange(function(){self.renderPalette();self.render();});
    }
    Editor.prototype.renderPalette=function(){
      var self=this;this.pal.innerHTML='';
      ACC.forEach(function(a){var b=document.createElement('button');b.type='button';b.className='mc-sym-btn';
        b.setAttribute('aria-label','Agregar: '+ACC_TXT[a]);b.title=ACC_TXT[a];b.innerHTML=symbolHTML(a);
        b.addEventListener('click',function(){if(self.locked)return;self.seq.push({a:a,n:1});self.render(true);var l=self.list;l.scrollLeft=l.scrollWidth;});self.pal.appendChild(b);});
    };
    Editor.prototype.set=function(seq){this.seq=seq.map(function(s){return {a:s.a,n:s.n||1};});this.render();};
    Editor.prototype.render=function(changed){
      var self=this,L=this.list;L.innerHTML='';
      if(!this.seq.length){L.innerHTML='<li class="mc-empty">Todavía no hay instrucciones. Toquen un símbolo para agregarlo.</li>';}
      this.seq.forEach(function(s,i){
        var li=document.createElement('li');li.className='mc-ins';li.dataset.i=i;
        li.innerHTML='<span class="mc-ins-n">'+(i+1)+'</span><span class="mc-ins-sym" role="img" aria-label="'+ACC_TXT[s.a]+'">'+symbolHTML(s.a)+'</span>'+
          (self.repeat?'<span class="mc-rep"><button type="button" data-act="menos" aria-label="Repetir una vez menos">−</button><span class="mc-rep-n" aria-label="Se repite '+s.n+' '+(s.n>1?'veces':'vez')+'">×'+s.n+'</span><button type="button" data-act="mas" aria-label="Repetir una vez más">+</button></span>':'')+
          '<span class="mc-ins-tools"><button type="button" data-act="izq" aria-label="Mover antes">◀</button><button type="button" data-act="der" aria-label="Mover después">▶</button><button type="button" data-act="quitar" aria-label="Quitar esta instrucción">✕</button></span>';
        L.appendChild(li);
      });
      L.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){
        if(self.locked)return;
        var i=+b.closest('li').dataset.i,act=b.dataset.act,s=self.seq;
        if(act==='quitar')s.splice(i,1);
        else if(act==='izq'&&i>0){var t=s[i-1];s[i-1]=s[i];s[i]=t;}
        else if(act==='der'&&i<s.length-1){var t2=s[i+1];s[i+1]=s[i];s[i]=t2;}
        else if(act==='mas')s[i].n=Math.min(9,s[i].n+1);
        else if(act==='menos')s[i].n=Math.max(1,s[i].n-1);
        var sl=L.scrollLeft;self.render(true);L.scrollLeft=sl;
        var again=self.list.querySelector('li[data-i="'+Math.min(i,s.length-1)+'"] button[data-act="'+act+'"]');if(again)again.focus();
      });});
      if(changed&&this.opts.onChange)this.opts.onChange();
    };
    Editor.prototype.mark=function(i){this.list.querySelectorAll('.mc-ins').forEach(function(li){var on=+li.dataset.i===i;li.classList.toggle('is-running',on);if(on&&li.scrollIntoView)li.scrollIntoView({block:'nearest',inline:'nearest'});});};
    Editor.prototype.lock=function(v){this.locked=v;this.host.classList.toggle('is-locked',v);};
    Editor.prototype.count=function(){var av=0,gi=0;this.seq.forEach(function(s){if(s.a==='AVANZAR')av+=s.n;else if(s.a!=='DETENER')gi+=s.n;});return {av:av,gi:gi,ins:this.seq.length};};
    Editor.prototype.symbolsHTML=function(){return this.seq.map(function(s){return '<span class="mini-sym" title="'+ACC_TXT[s.a]+'">'+symbolHTML(s.a,'mini-img')+(s.n>1?'<b>×'+s.n+'</b>':'')+'</span>';}).join('');};

    /* ---------- Unidad de juego: tablero + editor + controles + resultado ---------- */
    function Play(host,cfg){
      var self=this;this.cfg=cfg;
      host.innerHTML='<div class="mc-play"><div class="mc-left"><div class="mc-board-host"></div><p class="sr-only mc-status" aria-live="polite"></p></div>'+
        '<div class="mc-right"><div class="mc-editor"></div><div class="mc-actions">'+
        '<button type="button" class="btn btn-primary btn-sm" data-run>▶ Ejecutar</button><button type="button" class="btn btn-secondary btn-sm" data-reset title="Volver el personaje al inicio">Al inicio</button><button type="button" class="btn btn-outline btn-sm" data-clear title="Borrar toda la secuencia">Borrar</button><span class="mc-extra"></span></div>'+
        '<div class="mc-result" role="status" aria-live="polite"></div></div></div>';
      this.bh=host.querySelector('.mc-board-host');this.status=host.querySelector('.mc-status');this.result=host.querySelector('.mc-result');this.extra=host.querySelector('.mc-extra');
      this.ed=new Editor(host.querySelector('.mc-editor'),{repeat:cfg.repeat,onChange:function(){self.clearResult();if(cfg.onEdit)cfg.onEdit();}});
      this.load(cfg.level,cfg.char,cfg.goal);
      host.querySelector('[data-run]').addEventListener('click',function(){self.run();});
      host.querySelector('[data-reset]').addEventListener('click',function(){if(self.busy)return;self.board.reset();self.updateStatus();self.clearResult();});
      host.querySelector('[data-clear]').addEventListener('click',function(){if(self.busy)return;self.ed.set([]);self.clearResult();if(cfg.onEdit)cfg.onEdit();});
      this.runBtn=host.querySelector('[data-run]');
    }
    Play.prototype.clearResult=function(){this.result.className='mc-result';this.result.textContent=this.cfg.hint||'Armen la secuencia con los símbolos y toquen «Ejecutar».';};
    Play.prototype.load=function(level,ch,goal){this.level=level;this.board=new Board(this.bh,level,ch,goal,this.cfg.maxH);this.updateStatus();this.clearResult();};
    Play.prototype.updateStatus=function(){var g=this.level.goal;this.status.textContent='El personaje está en la '+this.board.where()+'. La meta está en la columna '+(g.x+1)+', fila '+(g.y+1)+'.';};
    Play.prototype.run=function(){
      var self=this;if(this.busy)return;

    function obstSet(L){var o={};L.obst.forEach(function(a){o[a[0]+','+a[1]]=1;});return o;}
    function reach(L,sx,sy,x,y){var ob=obstSet(L),seen={},q=[[sx,sy]];seen[sx+','+sy]=1;
      while(q.length){var c=q.shift();if(c[0]===x&&c[1]===y)return true;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=c[0]+d[0],ny=c[1]+d[1],k=nx+','+ny;if(nx<0||ny<0||nx>=L.cols||ny>=L.rows||ob[k]||seen[k])return;seen[k]=1;q.push([nx,ny]);});}return false;}
    function grid(box,mode){if(!sel.lab){box.innerHTML='';return;}var L=MC.LABS[sel.lab],ob=obstSet(L),h='<span></span>';
      box.style.gridTemplateColumns='26px repeat('+L.cols+',var(--pc))';
      for(var x=0;x<L.cols;x++)h+='<span class="pn" aria-hidden="true">'+(x+1)+'</span>';
      for(var y=0;y<L.rows;y++){h+='<span class="pn" aria-hidden="true">'+(y+1)+'</span>';
        for(var x2=0;x2<L.cols;x2++){var k=x2+','+y,lab='columna '+(x2+1)+', fila '+(y+1),isS=sel.start&&sel.start.x===x2&&sel.start.y===y,isG=sel.pos&&sel.pos.x===x2&&sel.pos.y===y;
          if(ob[k]){h+='<span class="pc obst" aria-hidden="true"></span>';continue;}
          var inner='';
          if(isS&&sel.char)inner='<svg viewBox="-60 -60 120 120" aria-hidden="true" style="transform:rotate('+(sel.start.d*90)+'deg)">'+MC.CHARS[sel.char].svg+'</svg>';
          else if(isG&&sel.goal)inner='<svg viewBox="-60 -60 120 120" aria-hidden="true">'+MC.GOALS[sel.goal].svg+'</svg>';
          var cls='pc'+(isS?' start':'')+(isG?' goal':'');
          if(mode===2&&isS){h+='<span class="'+cls+'" title="Salida del personaje">'+inner+'</span>';continue;}
          var al=mode===1?(isS?'El personaje está en '+lab+' y mira hacia '+DIRS[sel.start.d]+'. Tocar para girarlo':'Ubicar el personaje en '+lab):(isG?'La meta está en '+lab:'Ubicar la meta en '+lab);
          h+='<button type="button" class="'+cls+'" data-x="'+x2+'" data-y="'+y+'" aria-label="'+al+'">'+inner+'</button>';}}
      box.innerHTML=h;}
    function say(el,t,ok){el.textContent=t;el.className=el.className.replace(/\b(ok|bad)\b/g,'').trim()+' '+(ok?'ok':'bad');}
    function rotate(){if(!sel.start)return;sel.start.d=(sel.start.d+1)%4;P=null;refresh();say(msg1,'Mira hacia '+DIRS[sel.start.d]+'.',true);var f=g1.querySelector('.pc.start');if(f)f.focus();}
    rotBtn.addEventListener('click',rotate);
    g1.addEventListener('click',function(e){var b=e.target.closest('button.pc');if(!b)return;var x=+b.dataset.x,y=+b.dataset.y;
      if(!sel.char){say(msg1,'Primero elijan un personaje.',false);return;}
      if(sel.start&&sel.start.x===x&&sel.start.y===y){rotate();return;}
      sel.start={x:x,y:y,d:sel.start?sel.start.d:0};P=null;
      var L=MC.LABS[sel.lab];if(sel.pos&&((sel.pos.x===x&&sel.pos.y===y)||!reach(L,x,y,sel.pos.x,sel.pos.y))){sel.pos=null;}
      refresh();say(msg1,'Empieza en la columna '+(x+1)+', fila '+(y+1)+' y mira hacia '+DIRS[sel.start.d]+'.',true);var f=g1.querySelector('.pc.start');if(f)f.focus();});
    g2.addEventListener('click',function(e){var b=e.target.closest('button.pc');if(!b)return;var x=+b.dataset.x,y=+b.dataset.y,L=MC.LABS[sel.lab];
      if(!sel.goal){say(msg2,'Primero elijan la meta.',false);return;}
      if(!reach(L,sel.start.x,sel.start.y,x,y)){say(msg2,'A esa casilla el personaje no puede llegar: elijan otra.',false);return;}
      sel.pos={x:x,y:y};P=null;refresh();say(msg2,'La meta está en la columna '+(x+1)+', fila '+(y+1)+'.',true);var f=g2.querySelector('.pc.goal');if(f)f.focus();});
    function refresh(){
      st0.textContent=sel.lab?'Escenario: '+MC.LABS[sel.lab].nombre+'.':'Toquen uno de los laberintos.';
      stepBtns.forEach(function(b,i){b.disabled=!okAt(i);});
      host.querySelectorAll('[data-go]').forEach(function(b){var i=+b.dataset.go;if(i>step)b.disabled=!okAt(i);});
      rotBtn.disabled=!sel.start;
      if(step===1)grid(g1,1);if(step===2)grid(g2,2);}
    function setProbada(v){probada=v;testBadge.className='test-badge '+(v?'ok':'pend');testBadge.textContent=v?'La secuencia actual llegó a la meta en la última prueba.':'La secuencia actual todavía no llegó a la meta en una prueba.';}
    function build(seq){
      P=new MC.Play(playHost,{level:level(),char:sel.char,goal:sel.goal,repeat:true,maxH:290,onEdit:function(){setProbada(false);},onResult:function(r){setProbada(!!r.ok);}});
      if(seq)P.ed.set(seq);setProbada(false);
    }
    function go(i){
      if(!okAt(i))return;
      if(i>=3&&!P)build(null);
      step=i;panes.forEach(function(p,j){p.hidden=j!==i;});stepBtns.forEach(function(b,j){b.setAttribute('aria-selected',String(j===i));});
      if(i===1){msg1.textContent=sel.start?'Empieza en la columna '+(sel.start.x+1)+', fila '+(sel.start.y+1)+' y mira hacia '+DIRS[sel.start.d]+'.':'';}
      if(i===2){msg2.textContent=sel.pos?'La meta está en la columna '+(sel.pos.x+1)+', fila '+(sel.pos.y+1)+'.':'';}
      if(i===4)summary.textContent=MC.LABS[sel.lab].nombre+' · '+MC.CHARS[sel.char].nombre+' · '+MC.GOALS[sel.goal].nombre+(P&&P.ed.seq.length?' · '+P.ed.seq.length+' instrucciones':'');
      refresh();
    }
    stepBtns.forEach(function(b,i){b.addEventListener('click',function(){go(i);});});
    host.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){var i=+b.dataset.go;go(i);if(!panes[i].hidden&&stepBtns[i])stepBtns[i].focus();});});
    host.querySelector('[data-new]').addEventListener('click',function(){editId=null;nameIn.value='';checks.forEach(function(c){c.checked=false;});sel={lab:null,char:null,goal:null,start:null,pos:null};P=null;
      [bLab,bChar,bGoal].forEach(function(b){mark(b,null);});msg1.textContent=msg2.textContent='';saveMsg.textContent='';go(0);});
    saveBtn.addEventListener('click',function(){
      var n=nameIn.value.trim();
      if(!n){saveMsg.className='save-msg bad';saveMsg.textContent='Escriban un nombre para la misión antes de guardarla.';nameIn.focus();return;}
      if(!P||!P.ed.seq.length||!probada){saveMsg.className='save-msg bad';saveMsg.textContent='Todavía no se puede guardar: en «Programar», comprueben que el personaje llega a la meta.';return;}
      var st=MC.store(),m={id:editId||('m'+Date.now()),nombre:n,laberinto:sel.lab,personaje:sel.char,meta:sel.goal,salida:{x:sel.start.x,y:sel.start.y,d:sel.start.d},metaPos:{x:sel.pos.x,y:sel.pos.y},solucion:P.ed.seq.map(function(s){return {a:s.a,n:s.n};}),fecha:new Date().toISOString()};
      var i=st.misiones.findIndex(function(x){return x.id===m.id;});if(i>=0)st.misiones[i]=m;else st.misiones.push(m);editId=m.id;
      MC.save();saveMsg.className='save-msg ok';saveMsg.textContent='Misión «'+n+'» guardada en este dispositivo'+(MC.persist()?'.':' solo mientras esta página esté abierta.');
    });
    function edit(id){var m=MC.store().misiones.find(function(x){return x.id===id;});if(!m)return;var L=MC.LABS[m.laberinto];
      sel={lab:m.laberinto,char:m.personaje,goal:m.meta,start:m.salida?{x:m.salida.x,y:m.salida.y,d:m.salida.d}:{x:L.start.x,y:L.start.y,d:L.start.d},pos:m.metaPos?{x:m.metaPos.x,y:m.metaPos.y}:{x:L.goal.x,y:L.goal.y}};
      mark(bLab,sel.lab);mark(bChar,sel.char);mark(bGoal,sel.goal);
      editId=m.id;nameIn.value=m.nombre;saveMsg.textContent='';step=3;build(m.solucion);go(3);host.scrollIntoView({block:'start'});stepBtns[3].focus();}
    go(0);
    return {edit:edit};
  })();

  /* ---------- Misiones guardadas (D4) y Sala digital (D5) ---------- */
  (function(){
    var l4=document.getElementById('lista-d4-box');if(l4)MC.MissionList(l4,{manage:true,emptyHint:' Creen y guarden una misión en «Crear una misión».',onEdit:function(id){if(Crear)Crear.edit(id);}});
    var sala=document.getElementById('sala');if(!sala)return;
    MC.MissionList(sala,{manage:false,emptyHint:' Las misiones se guardan en «Crear una misión» (Desafío 5) o se cargan desde un archivo.'});
    var exp=document.getElementById('sala-exportar'),imp=document.getElementById('sala-importar'),msg=document.getElementById('sala-msg');
    exp.addEventListener('click',function(){
      var ms=MC.store().misiones;if(!ms.length){msg.textContent='No hay misiones para descargar.';return;}
      var blob=new Blob([JSON.stringify({version:'1.0',tipo:'misiones',misiones:ms},null,2)],{type:'application/json'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='misiones_sala_digital.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
      msg.textContent='Se descargó un archivo con '+ms.length+(ms.length>1?' misiones.':' misión.');
    });
    imp.addEventListener('change',function(){
      var f=imp.files[0];if(!f)return;var r=new FileReader();
      r.onload=function(){try{var d=JSON.parse(r.result),list=(d&&d.misiones)||[],n=0,st=MC.store();
        list.forEach(function(m){if(m&&m.id&&m.nombre&&MC.LABS[m.laberinto]&&MC.CHARS[m.personaje]&&MC.GOALS[m.meta]&&Array.isArray(m.solucion)){if(!st.misiones.some(function(x){return x.id===m.id;})){st.misiones.push(m);n++;}}});
        MC.save();msg.textContent=n?(n===1?'Se agregó 1 misión':'Se agregaron '+n+' misiones')+' desde el archivo.':'El archivo no tenía misiones nuevas para agregar.';}
        catch(e){msg.textContent='No se pudo leer el archivo: no tiene el formato de misiones de esta secuencia.';}
        imp.value='';};
      r.readAsText(f);
    });
  })();
</script>
